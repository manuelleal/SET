<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Simulacro ICFES · El examen se mudó</title>
<style>
  /* Valores de diseno/tokens.json (Navy Real, claro). Página estática, sin formulario ni JavaScript. */
  :root {
    --fondo: #F6F8FB; --superficie: #FFFFFF; --borde: #DFE4EA; --texto: #1B1F27;
    --primario: #003366; --primario-oscuro: #002347;
    --fuente-cuerpo: 'Nunito Sans', system-ui, sans-serif; --fuente-titulos: 'Baloo 2', system-ui, sans-serif;
    --radio-md: 16px; --radio-sm: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--fondo); color: var(--texto); font-family: var(--fuente-cuerpo); line-height: 1.5; }
  main { width: 100%; max-width: 34rem; background: var(--superficie); border: 1px solid var(--borde);
         border-radius: var(--radio-md); padding: 32px 24px; }
  h1 { font-family: var(--fuente-titulos); color: var(--primario); font-size: 1.75rem; line-height: 1.2; margin: 0 0 12px; }
  p { margin: 0 0 16px; font-size: 1.0625rem; }
  a.boton { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 24px;
            background: var(--primario); color: var(--superficie); border-radius: var(--radio-sm);
            font-weight: 700; text-decoration: none; }
  a.boton:hover { background: var(--primario-oscuro); }
  a.boton:focus-visible { outline: 3px solid var(--primario); outline-offset: 3px; }
  .direccion { font-weight: 700; word-break: break-word; }
</style>
</head>
<body>
<main>
  <h1>El simulacro se mudó</h1>
  <p>Ahora se presenta en la plataforma ENGRAMA. Usa el mismo código que te dio tu profe.</p>
  <p>La nueva dirección es <span class="direccion">set.engramaingles.com/icfes.html</span></p>
  <a class="boton" href="https://set.engramaingles.com/icfes.html">Ir al simulacro</a>
</main>
</body>
</html>
